[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
diesel = { version = "2.3.12", features = ["postgres_backend"] }
diesel-async = { version = "0.9.2", features = ["deadpool", "postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tracing-subscriber = "0.3"
